<!-- ce fichier est composant père de movies-detail et fils de liste-movies-->

  <div class="card h-100 text-center">
      <img
        width ="200"
        class="card-img-top"
        [src]="'https://image.tmdb.org/t/p/w500' + filmine.poster_path"
        [alt]="filmine.title"
        [routerLink]="['/movie', filmine.id]"
      >

      <div class="card-body">
        <h5 class="card-title">{{ filmine.title }} : {{ filmine.release_date }}</h5>
        <button class="" (click)="onaddfav()">Ajouter aux favoris</button>
      </div>
  </div>
