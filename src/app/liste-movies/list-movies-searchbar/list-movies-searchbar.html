<div class="container mt-5">
  <div class="row justify-content-center">
    <!-- Adjust column sizes to control the search bar width on different screens -->
    <div class="col-12 col-md-8 col-lg-6">
      <div class="input-group mb-3">
        <input
          type="text"
          class="form-control"
          placeholder="Search for a film..."
          [(ngModel)]="searchQuery"
          (keyup.enter)="onSearch()"
          (ngModelChange)="onSearch()"
        > <!-- what is the ngmodel and why did we use it here: it's the 2-way databinding // starting with ngmodel that updates the searchquery (ts2html) value then launches the event ngmodelchange (html2ts) -->
        <button
          class="btn btn-primary"
          type="button"
          (click)="onSearch()"
        >
          Search
        </button>
      </div>
    </div>
  </div>
</div>
