
<div class="search-wrapper position-relative w-100">
<div class="container mt-5 mb-4">
  <div class="row justify-content-center">
    <!-- Adjust column sizes to control the search bar width on different screens -->
    <div class="col-12 col-md-8 col-lg-6">
      <div class="input-group mb-3">
        <input
          type="text"
          class="form-control"
          placeholder="Search for a film..."
          [(ngModel)]="searchQuery"
          (ngModelChange)="onSearch()"
          (keyup.enter)="onSearch()"
        > <!-- what is the ngmodel and why did we use it here: it's the 2-way databinding // starting with ngmodel that updates the searchquery (ts2html) value then launches the event ngmodelchange (html2ts) -->
        <button
          class="btn btn-primary"
          type="button"
          (click)="onSearch()"
        >
          Search
        </button>

        @if (movies && movies.length > 0) {
          <div class="list-group w-100 mt-2 shadow-sm">
            @for (movie of movies; track movie.id) {
              <div class="list-group-item list-group-item-action d-flex align-items-center gap-3 py-2">

                <!-- Small thumbnail on the left -->
                <img
                  [src]="movie.poster_path ? 'https://image.tmdb.org/t/p/w92' + movie.poster_path : 'https://placehold.co/40x55?text=No+Image'"
                  [alt]="movie.title"
                  class="rounded"
                  style="width: 40px; height: 55px; object-fit: cover; flex-shrink: 0;"
                >
                <!-- Film Title -->
                <span class="fw-semibold text-truncate">
                {{ movie.title }}
              </span>

              </div>
            }
          </div>
        }

      </div>
    </div>
  </div>
</div>
</div>
