<h1>Liste des films présents</h1>
<div class="position-relative" style="z-index: 1050;">
  <app-list-movies-searchbar></app-list-movies-searchbar>
</div>

<div class="container movies-grid position-relative" style="z-index: 1;">
  <div class="row g-4">
  @for (film of Films; track film.id) {
    <div class="col-3">
    <app-movies-card [filmine]="film" (filmSelected)="addfav(film)" ></app-movies-card> <!-- [fils directive input name]="pere" and (fils directive output name)="do(pere)"-->
    </div>
  }
  </div>
</div>
