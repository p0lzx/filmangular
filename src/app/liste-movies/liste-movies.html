
<div class="row">
  @for (film of Films; track film.id) {
    <div class="col-md-3 mb-4">
      <div class="card">
        <img
          class="card-img-top"
          [src]="'https://image.tmdb.org/t/p/w500' + film.poster_path"
          [alt]="film.title"
        >

        <div class="card-body">
          <h5 class="card-title">{{ film.title }}</h5>
          <p class="card-text">{{ film.overview }}</p>
        </div>
      </div>
    </div>
  }
</div>
